<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <text x="18" y="18" font-size="11" fill="#666" font-family="sans-serif">□=男性 ○=女性 ◆=患病（填充为患者）</text>
  <!-- 第Ⅰ代：Ⅰ1 □ × Ⅰ2 ○（均正常） -->
  <rect x="50" y="40" width="22" height="22" fill="#f5f5f5" stroke="#222" stroke-width="1.6"/>
  <circle cx="112" cy="51" r="11" fill="#f5f5f5" stroke="#222" stroke-width="1.6"/>
  <line x1="72" y1="51" x2="101" y2="51" stroke="#222" stroke-width="1.2"/>
  <text x="47" y="76" font-size="11" fill="#444" font-family="sans-serif">Ⅰ1</text>
  <text x="108" y="76" font-size="11" fill="#444" font-family="sans-serif">Ⅰ2</text>
  <line x1="81" y1="51" x2="81" y2="92" stroke="#222" stroke-width="1.2"/>
  <!-- 第Ⅱ代：Ⅱ1 ●（患病女性）、Ⅱ2 □（正常男性） -->
  <circle cx="66" cy="105" r="11" fill="#222" stroke="#222" stroke-width="1.6"/>
  <rect x="96" y="94" width="22" height="22" fill="#f5f5f5" stroke="#222" stroke-width="1.6"/>
  <text x="49" y="130" font-size="11" fill="#444" font-family="sans-serif">Ⅱ1</text>
  <text x="96" y="130" font-size="11" fill="#444" font-family="sans-serif">Ⅱ2</text>
  <text x="20" y="160" font-size="11.5" fill="#444" font-family="sans-serif">女患病，父Ⅰ1 正常 ⇒ 排除伴X隐性</text>
  <text x="20" y="180" font-size="11.5" fill="#c62828" font-family="sans-serif">⇒ 常染色体隐性遗传</text>
</svg>
