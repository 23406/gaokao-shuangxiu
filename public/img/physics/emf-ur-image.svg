<svg xmlns="http://www.w3.org/2000/svg" width="560" height="380" viewBox="0 0 560 380" font-family="sans-serif">
  <rect width="560" height="380" fill="#1a1a1a"/>
  <!-- 坐标轴 -->
  <path d="M80,300 L80,30 M80,300 L520,300" stroke="#444" stroke-width="1.6" fill="none"/>
  <text x="56" y="50" fill="#666" font-size="13">U/V</text>
  <text x="528" y="318" fill="#666" font-size="13">I/A</text>
  <!-- 刻度 -->
  <g fill="#666" font-size="11">
    <text x="176" y="316">0.5</text><text x="276" y="316">1.0</text><text x="376" y="316">1.5</text><text x="476" y="316">2.0</text>
    <text x="60" y="244">1</text><text x="60" y="184">2</text><text x="60" y="124">3</text>
    <path d="M180,300 L180,306 M280,300 L280,306 M380,300 L380,306 M480,300 L480,306 M80,240 L86,240 M80,180 L86,180 M80,120 L86,120" stroke="#444" stroke-width="1"/>
  </g>
  <!-- 真实线（蓝）：E真=3V, r真=2Ω，短路点 I=1.5A @ (380,300) -->
  <path d="M80,120 L380,300" stroke="#1565c0" stroke-width="2.2" fill="none"/>
  <!-- 测量线（橙虚线）：E测=2.4V, r测=1.6Ω，共点于 (380,300) -->
  <path d="M80,156 L380,300" stroke="#e65100" stroke-width="2.2" stroke-dasharray="8 5" fill="none"/>
  <!-- 纵截距点 -->
  <circle cx="80" cy="120" r="4" fill="#1565c0"/>
  <circle cx="80" cy="156" r="4" fill="#e65100"/>
  <text x="92" y="112" fill="#1565c0" font-size="13">E 真（截距）</text>
  <text x="92" y="148" fill="#e65100" font-size="13">E 测（截距变小）</text>
  <!-- 共点 -->
  <circle cx="380" cy="300" r="5" fill="#c62828"/>
  <text x="392" y="292" fill="#c62828" font-size="12">短路电流 I短 = E/r 相同</text>
  <!-- 斜率说明 -->
  <text x="392" y="78" fill="#555" font-size="11">斜率绝对值 = r：蓝线陡（r真 大）</text>
  <text x="392" y="96" fill="#555" font-size="11">橙线缓（r测 = r真/(1+r/RV) 小）</text>
  <!-- 图例 -->
  <rect x="60" y="42" width="14" height="4" fill="#1565c0"/>
  <text x="80" y="48" fill="#ccc" font-size="11">真实：U = E真 − r真·I</text>
  <rect x="60" y="60" width="14" height="4" fill="#e65100"/>
  <text x="80" y="66" fill="#ccc" font-size="11">测量：E测&lt;E真、r测&lt;r真</text>
</svg>
