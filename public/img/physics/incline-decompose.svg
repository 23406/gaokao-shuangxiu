<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 225" width="280" height="225">
  <defs>
    <marker id="ah-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#222"/>
    </marker>
    <marker id="ah-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#2e7d32"/>
    </marker>
  </defs>
  <polygon points="40,180 240,80 240,180" fill="#eef7f0" stroke="none"/>
  <line x1="15" y1="180" x2="265" y2="180" stroke="#444" stroke-width="2"/>
  <line x1="40" y1="180" x2="240" y2="80" stroke="#444" stroke-width="2.5"/>
  <path d="M40,180 L88,180 A60,60 0 0 0 61,150" fill="none" stroke="#888" stroke-width="1.2"/>
  <text x="52" y="170" font-size="13" fill="#555" font-family="sans-serif">θ</text>
  <!-- 物体 -->
  <g transform="translate(142,129) rotate(-26.57)">
    <rect x="-18" y="-20" width="36" height="20" fill="#f5f5f5" stroke="#222" stroke-width="1.8"/>
  </g>
  <!-- G（竖直向下，实线） -->
  <line x1="138" y1="121" x2="138" y2="168" stroke="#222" stroke-width="2" marker-end="url(#ah-black)"/>
  <text x="144" y="162" font-size="14" fill="#222" font-family="sans-serif">G</text>
  <!-- 分解平行四边形（虚线） -->
  <line x1="138" y1="121" x2="166" y2="134" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5,4"/>
  <line x1="138" y1="121" x2="121" y2="95" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5,4"/>
  <line x1="138" y1="121" x2="166" y2="134" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="5,4"/>
  <!-- Gx 沿斜面（绿色实线箭头，终点带虚线框） -->
  <line x1="138" y1="121" x2="178" y2="101" stroke="#2e7d32" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="178" y="90" font-size="14" fill="#2e7d32" font-family="sans-serif">Gx=Gsinθ</text>
  <!-- Gy 垂直斜面（绿色实线箭头） -->
  <line x1="138" y1="121" x2="121" y2="95" stroke="#2e7d32" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="100" y="90" font-size="14" fill="#2e7d32" font-family="sans-serif">Gy=Gcosθ</text>
  <text x="14" y="20" font-size="10.5" fill="#666" font-family="sans-serif">重力分解：沿斜面 Gsinθ · 垂直斜面 Gcosθ</text>
</svg>
