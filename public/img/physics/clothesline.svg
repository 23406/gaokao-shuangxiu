<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" width="280" height="200">
  <defs>
    <marker id="ah-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#00695c"/>
    </marker>
  </defs>
  <!-- 晾衣架模型：绳两端固定在 A、B，衣服在中点 C -->
  <line x1="20" y1="45" x2="260" y2="45" stroke="#444" stroke-width="2.5"/>
  <!-- 绳：A——C——B（自然下垂） -->
  <line x1="60" y1="45" x2="140" y2="120" stroke="#00695c" stroke-width="2.2" marker-end="url(#ah-teal)"/>
  <line x1="140" y1="120" x2="220" y2="45" stroke="#00695c" stroke-width="2.2"/>
  <!-- 衣服 -->
  <g transform="translate(140,126)">
    <rect x="-14" y="-6" width="28" height="24" rx="3" fill="#e0f2f1" stroke="#00695c" stroke-width="1.8"/>
    <line x1="-14" y1="4" x2="14" y2="4" stroke="#00695c" stroke-width="1.4"/>
  </g>
  <!-- 重力 G -->
  <line x1="140" y1="144" x2="140" y2="172" stroke="#222" stroke-width="2"/>
  <text x="147" y="168" font-size="14" fill="#222" font-family="sans-serif">G</text>
  <!-- 绳与水平夹角 θ → 2Tsinθ = G -->
  <path d="M74,55 A36,36 0 0 1 96,72" fill="none" stroke="#888" stroke-width="1.2"/>
  <text x="80" y="70" font-size="13" fill="#555" font-family="sans-serif">θ</text>
  <text x="20" y="20" font-size="11.5" fill="#666" font-family="sans-serif">2T·sinθ = G：θ 变小（绳更平）⇒ 拉力 T 变大</text>
</svg>
