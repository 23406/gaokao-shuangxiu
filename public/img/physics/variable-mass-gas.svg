<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 350" width="660" height="350">
  <!-- 变质量气体：充气（pV 相加）vs 抽气（等比保留） -->
  <defs>
    <marker id="vg-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
    <marker id="vg-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#c62828"/>
    </marker>
  </defs>
  <line x1="330" y1="28" x2="330" y2="310" stroke="#ddd" stroke-width="1"/>
  <text x="175" y="18" font-size="12.5" fill="#444" font-family="sans-serif" text-anchor="middle">① 充气：pV 相加（等温时 pV ∝ 物质的量）</text>
  <text x="495" y="18" font-size="12.5" fill="#444" font-family="sans-serif" text-anchor="middle">② 抽气：每次等比保留</text>
  <!-- 左：充气 -->
  <rect x="60" y="88" width="190" height="112" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="155" y="122" font-size="12" fill="#1565c0" font-family="sans-serif" text-anchor="middle">胎 / 容器 V（不变）</text>
  <text x="155" y="168" font-size="11.5" fill="#555" font-family="sans-serif" text-anchor="middle">原气体 p₀V 　不断加入</text>
  <!-- 打气筒 -->
  <rect x="300" y="76" width="46" height="28" fill="#f5f5f5" stroke="#8d6e63" stroke-width="2"/>
  <line x1="323" y1="60" x2="323" y2="76" stroke="#8d6e63" stroke-width="3"/>
  <line x1="303" y1="60" x2="343" y2="60" stroke="#8d6e63" stroke-width="3"/>
  <text x="298" y="50" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">打气筒</text>
  <line x1="300" y1="90" x2="256" y2="90" stroke="#1565c0" stroke-width="2" marker-end="url(#vg-a)"/>
  <text x="272" y="110" font-size="11" fill="#1565c0" font-family="sans-serif" text-anchor="middle">每筒 p₀、V₀</text>
  <!-- 公式 -->
  <rect x="45" y="228" width="260" height="58" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.5"/>
  <text x="175" y="252" font-size="12" fill="#555" font-family="sans-serif" text-anchor="middle">原气 p₀V + n 筒 ·(p₀V₀) = 末压 p·V</text>
  <text x="175" y="274" font-size="12.5" fill="#c62828" font-family="sans-serif" text-anchor="middle">p = p₀ + n·p₀V₀ / V</text>
  <text x="175" y="318" font-size="11.5" fill="#666" font-family="sans-serif" text-anchor="middle">关键：把"质量"换成 pV，直接相加</text>
  <!-- 右：抽气 -->
  <rect x="370" y="88" width="190" height="112" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="465" y="122" font-size="12" fill="#1565c0" font-family="sans-serif" text-anchor="middle">贮气罐 V=20L（不变）</text>
  <text x="465" y="168" font-size="11.5" fill="#555" font-family="sans-serif" text-anchor="middle">罐内每次被抽走一部分</text>
  <!-- 抽气泵 -->
  <rect x="588" y="108" width="56" height="40" fill="#f5f5f5" stroke="#8d6e63" stroke-width="2"/>
  <text x="616" y="94" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">抽气泵</text>
  <line x1="560" y1="128" x2="584" y2="128" stroke="#c62828" stroke-width="2" marker-end="url(#vg-b)"/>
  <text x="560" y="116" font-size="11" fill="#c62828" font-family="sans-serif" text-anchor="middle">抽走 V₀</text>
  <!-- 公式 -->
  <rect x="355" y="228" width="260" height="58" rx="6" fill="#fff8e1" stroke="#e65100" stroke-width="1.5"/>
  <text x="485" y="252" font-size="12" fill="#555" font-family="sans-serif" text-anchor="middle">每抽一次：p′ = p · V/(V+V₀)</text>
  <text x="485" y="274" font-size="12.5" fill="#c62828" font-family="sans-serif" text-anchor="middle">抽 n 次：pₙ = p₀ · (V/(V+V₀))ⁿ</text>
  <text x="485" y="318" font-size="11.5" fill="#666" font-family="sans-serif" text-anchor="middle">关键：是乘比例，不能做减法！</text>
</svg>
