<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- 铝三角：Al³⁺ ⇌ Al(OH)₃ ⇌ [Al(OH)₄]⁻（横排三框 + 底部弧线回环） -->
  <defs>
    <marker id="al-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
  </defs>
  <text x="320" y="16" font-size="12.5" fill="#444" font-family="sans-serif" text-anchor="middle">铝三角：Al³⁺ ⇌ Al(OH)₃ ⇌ [Al(OH)₄]⁻（双向箭头 = 加不同试剂即可互相转化）</text>
  <!-- 三框 -->
  <rect x="20" y="52" width="140" height="42" rx="8" fill="#f6faf7" stroke="#888" stroke-width="1.2"/>
  <text x="90" y="78" font-size="15" fill="#1565c0" font-family="sans-serif" text-anchor="middle">Al³⁺</text>
  <rect x="250" y="52" width="140" height="42" rx="8" fill="#f6faf7" stroke="#888" stroke-width="1.2"/>
  <text x="320" y="78" font-size="15" fill="#2e7d32" font-family="sans-serif" text-anchor="middle">Al(OH)₃</text>
  <rect x="480" y="52" width="140" height="42" rx="8" fill="#f6faf7" stroke="#888" stroke-width="1.2"/>
  <text x="550" y="78" font-size="15" fill="#e65100" font-family="sans-serif" text-anchor="middle">[Al(OH)₄]⁻</text>
  <!-- 箭头 1：Al³⁺ ⇌ Al(OH)₃ -->
  <line x1="160" y1="73" x2="250" y2="73" stroke="#1565c0" stroke-width="2.2" marker-end="url(#al-a)"/>
  <line x1="250" y1="76" x2="160" y2="76" stroke="#1565c0" stroke-width="2.2" marker-end="url(#al-a)"/>
  <text x="205" y="48" font-size="10.5" fill="#1565c0" font-family="sans-serif" text-anchor="middle">+OH⁻ 适量</text>
  <text x="205" y="109" font-size="10.5" fill="#1565c0" font-family="sans-serif" text-anchor="middle">+H⁺</text>
  <!-- 箭头 2：Al(OH)₃ ⇌ [Al(OH)₄]⁻ -->
  <line x1="390" y1="73" x2="480" y2="73" stroke="#e65100" stroke-width="2.2" marker-end="url(#al-a)"/>
  <line x1="480" y1="76" x2="390" y2="76" stroke="#e65100" stroke-width="2.2" marker-end="url(#al-a)"/>
  <text x="435" y="48" font-size="10.5" fill="#e65100" font-family="sans-serif" text-anchor="middle">+OH⁻ 过量</text>
  <text x="435" y="109" font-size="10.5" fill="#e65100" font-family="sans-serif" text-anchor="middle">+H⁺ 过量</text>
  <!-- 底部弧线：Al³⁺ ⇌ [Al(OH)₄]⁻（示意 +4OH⁻ / +4H⁺） -->
  <path d="M90,94 Q320 250 550,94" fill="none" stroke="#c62828" stroke-width="1.8" stroke-dasharray="7,4"/>
  <text x="320" y="206" font-size="11" fill="#c62828" font-family="sans-serif" text-anchor="middle">+4OH⁻（正）</text>
  <text x="320" y="222" font-size="11" fill="#c62828" font-family="sans-serif" text-anchor="middle">+4H⁺（反）</text>
  <!-- 底部注释 -->
  <text x="320" y="258" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">Al 与强酸 → Al³⁺ + H₂；与强碱 → [Al(OH)₄]⁻ + H₂（两性金属）</text>
  <text x="320" y="276" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">Al(OH)₃ 溶于强酸/强碱，但 不溶于过量氨水（氨水弱碱性只出沉淀）</text>
</svg>
