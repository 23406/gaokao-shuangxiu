<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 340" width="480" height="340">
  <!-- 轨迹方程一图：椭圆（定义法）+ 中垂线（差=0）+ 相关点法 -->
  <defs>
    <marker id="lp-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <text x="240" y="16" font-size="12.5" fill="#444" font-family="sans-serif" text-anchor="middle">|PA|+|PB| = 10 ＞ |AB| = 6 ⇒ 椭圆；|QA| = |QB| ⇒ 中垂线（y 轴）</text>
  <!-- 坐标轴 -->
  <line x1="40" y1="160" x2="440" y2="160" stroke="#444" stroke-width="1.4" marker-end="url(#lp-a)"/>
  <line x1="200" y1="324" x2="200" y2="34" stroke="#444" stroke-width="1.4" marker-end="url(#lp-a)"/>
  <text x="434" y="178" font-size="11.5" fill="#444" font-family="sans-serif" text-anchor="end">x</text>
  <text x="188" y="338" font-size="11.5" fill="#444" font-family="sans-serif">y</text>
  <!-- 中垂线 x=0 绿虚线 -->
  <line x1="200" y1="34" x2="200" y2="324" stroke="#2e7d32" stroke-width="1.6" stroke-dasharray="8,5"/>
  <text x="212" y="46" font-size="11.5" fill="#2e7d32" font-family="sans-serif">|QA|=|QB| ⇒ 中垂线 x=0</text>
  <!-- 椭圆（x²/25+y²/16=1，中心 O(200,160)，40px/单位） -->
  <polyline points="400,160 399.2,147.3 396.9,134.6 393,122.2 387.6,110.1 380.7,98.3 372.5,87.1 362.8,76.4 351.9,66.4 339.8,57.1 326.7,48.6 312.5,40.9 297.4,34.2 281.6,28.5 265.2,23.9 248.2,20.2 230.8,17.7 213.3,16.3 195.6,16 177.9,16.9 160.4,18.8 143.3,21.9 126.5,26.1 110.4,31.3 94.9,37.5 80.3,44.6 66.6,52.7 54,61.6 42.5,71.3 32.2,81.7 23.2,92.6 15.7,104.2 9.5,116.1 4.9,128.4 1.8,140.9 0.2,153.6 0.2,166.4 1.8,179.1 4.9,191.6 9.5,203.9 15.7,215.8 23.2,227.4 32.2,238.3 42.5,248.7 54,258.4 66.6,267.3 80.3,275.4 94.9,282.5 110.4,288.7 126.5,293.9 143.3,298.1 160.4,301.2 177.9,303.1 195.6,304 213.3,303.7 230.8,302.3 248.2,299.8 265.2,296.1 281.6,291.5 297.4,285.8 312.5,279.1 326.7,271.4 339.8,262.9 351.9,253.6 362.8,243.6 372.5,232.9 380.7,221.7 387.6,209.9 393,197.8 396.9,185.4 399.2,172.7 400,160"
        fill="none" stroke="#1565c0" stroke-width="2.4"/>
  <!-- 焦点 A、B -->
  <circle cx="80" cy="160" r="5" fill="#c62828"/>
  <circle cx="320" cy="160" r="5" fill="#c62828"/>
  <text x="58" y="150" font-size="12" fill="#c62828" font-family="sans-serif">A(−3,0)</text>
  <text x="330" y="150" font-size="12" fill="#c62828" font-family="sans-serif">B(3,0)</text>
  <text x="52" y="205" font-size="11.5" fill="#1565c0" font-family="sans-serif">椭圆 x²/25 + y²/16 = 1</text>
  <!-- P(3, 3.2) 与线段 -->
  <circle cx="320" cy="45" r="5" fill="#e65100"/>
  <line x1="320" y1="45" x2="80" y2="160" stroke="#e65100" stroke-width="1.6" stroke-dasharray="6,3"/>
  <line x1="320" y1="45" x2="320" y2="160" stroke="#e65100" stroke-width="1.6" stroke-dasharray="6,3"/>
  <text x="330" y="40" font-size="12" fill="#e65100" font-family="sans-serif">P(3, 3.2)</text>
  <text x="216" y="146" font-size="11" fill="#e65100" font-family="sans-serif">|PA|+|PB|=10</text>
  <!-- 注释 -->
  <text x="240" y="322" font-size="11.5" fill="#666" font-family="sans-serif" text-anchor="middle">M 为 OP 中点 ⇒ 相关点法：P(2x,2y) 代入 ⇒ x²/(25/4) + y²/4 = 1</text>
</svg>
