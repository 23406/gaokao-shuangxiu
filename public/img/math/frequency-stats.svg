<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" width="620" height="400">
  <!-- 频率分布直方图：组距10，频率 0.10/0.20/0.35/0.25/0.10；中位数插值 -->
  <defs>
    <marker id="fs-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <text x="310" y="18" font-size="12.5" fill="#444" font-family="sans-serif" text-anchor="middle">频率分布直方图：纵轴=频率/组距，<tspan font-weight="bold">小矩形面积=频率</tspan>，总面积=1</text>
  <!-- 轴 -->
  <line x1="100" y1="300" x2="500" y2="300" stroke="#444" stroke-width="1.4" marker-end="url(#fs-a)"/>
  <line x1="100" y1="300" x2="100" y2="56" stroke="#444" stroke-width="1.4" marker-end="url(#fs-a)"/>
  <text x="108" y="70" font-size="11" fill="#444" font-family="sans-serif">频率/组距</text>
  <text x="96" y="252" font-size="11" fill="#666" font-family="sans-serif" text-anchor="end">0.01</text>
  <text x="96" y="200" font-size="11" fill="#666" font-family="sans-serif" text-anchor="end">0.02</text>
  <text x="96" y="148" font-size="11" fill="#666" font-family="sans-serif" text-anchor="end">0.03</text>
  <text x="96" y="96" font-size="11" fill="#666" font-family="sans-serif" text-anchor="end">0.04</text>
  <!-- 柱（间距 72px/区间） -->
  <rect x="120" y="248" width="72" height="52" fill="#1565c0" opacity="0.22" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="192" y="196" width="72" height="104" fill="#1565c0" opacity="0.22" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="264" y="118" width="72" height="182" fill="#1565c0" opacity="0.22" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="336" y="170" width="72" height="130" fill="#1565c0" opacity="0.22" stroke="#1565c0" stroke-width="1.5"/>
  <rect x="408" y="248" width="72" height="52" fill="#1565c0" opacity="0.22" stroke="#1565c0" stroke-width="1.5"/>
  <!-- 频率标注 -->
  <text x="156" y="238" font-size="11.5" fill="#1565c0" font-family="sans-serif" text-anchor="middle">0.10</text>
  <text x="228" y="186" font-size="11.5" fill="#1565c0" font-family="sans-serif" text-anchor="middle">0.20</text>
  <text x="300" y="108" font-size="11.5" fill="#1565c0" font-family="sans-serif" text-anchor="middle">0.35</text>
  <text x="372" y="160" font-size="11.5" fill="#1565c0" font-family="sans-serif" text-anchor="middle">0.25</text>
  <text x="444" y="238" font-size="11.5" fill="#1565c0" font-family="sans-serif" text-anchor="middle">0.10</text>
  <!-- x 刻度 -->
  <text x="120" y="320" font-size="11.5" fill="#444" font-family="sans-serif" text-anchor="middle">40</text>
  <text x="192" y="320" font-size="11.5" fill="#444" font-family="sans-serif" text-anchor="middle">50</text>
  <text x="264" y="320" font-size="11.5" fill="#444" font-family="sans-serif" text-anchor="middle">60</text>
  <text x="336" y="320" font-size="11.5" fill="#444" font-family="sans-serif" text-anchor="middle">70</text>
  <text x="408" y="320" font-size="11.5" fill="#444" font-family="sans-serif" text-anchor="middle">80</text>
  <text x="480" y="320" font-size="11.5" fill="#444" font-family="sans-serif" text-anchor="middle">90</text>
  <text x="500" y="316" font-size="11" fill="#444" font-family="sans-serif">x</text>
  <!-- 中位数插值竖线 -->
  <line x1="305" y1="60" x2="305" y2="300" stroke="#c62828" stroke-width="1.6" stroke-dasharray="6,4"/>
  <circle cx="305" cy="300" r="4" fill="#c62828"/>
  <text x="305" y="54" font-size="11.5" fill="#c62828" font-family="sans-serif" text-anchor="middle">中位数 ≈ 65.7（面积左=0.5）</text>
  <text x="298" y="288" font-size="11" fill="#c62828" font-family="sans-serif" text-anchor="end">左侧=0.3</text>
  <!-- 注释 -->
  <text x="310" y="345" font-size="11.5" fill="#666" font-family="sans-serif" text-anchor="middle">中位数：前两组面积 0.1+0.2=0.3＜0.5，进入 [60,70)（面积 0.35），还差 0.2 → 60 + (0.2/0.35)×10 ≈ 65.7</text>
  <text x="310" y="366" font-size="11.5" fill="#666" font-family="sans-serif" text-anchor="middle">均值：Σ(中点×频率) = 45×0.1+55×0.2+65×0.35+75×0.25+85×0.1 = 65.5（与中位数很接近即分布近似对称）</text>
</svg>
