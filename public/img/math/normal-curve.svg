<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210">
  <!-- 正态分布曲线 N(μ, σ²) -->
  <line x1="30" y1="180" x2="300" y2="180" stroke="#444" stroke-width="1.4"/>
  <line x1="160" y1="180" x2="160" y2="30" stroke="#888" stroke-width="1" stroke-dasharray="4,3"/>
  <path d="M30,178 C 90,178 120,40 160,40 C 200,40 230,178 290,178 Q 295,178 300,178"
        fill="none" stroke="#1565c0" stroke-width="2.2"/>
  <!-- μ±σ 区域 -->
  <rect x="105" y="88" width="110" height="92" fill="#2e7d32" opacity="0.12" stroke="none"/>
  <line x1="105" y1="178" x2="105" y2="92" stroke="#2e7d32" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="215" y1="178" x2="215" y2="92" stroke="#2e7d32" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="114" y="70" font-size="11.5" fill="#2e7d32" font-family="sans-serif">μ−σ</text>
  <text x="204" y="70" font-size="11.5" fill="#2e7d32" font-family="sans-serif">μ+σ</text>
  <!-- μ±2σ 区域 -->
  <rect x="50" y="120" width="60" height="60" fill="#c62828" opacity="0.10" stroke="none"/>
  <rect x="210" y="120" width="60" height="60" fill="#c62828" opacity="0.10" stroke="none"/>
  <line x1="50" y1="178" x2="50" y2="124" stroke="#c62828" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="270" y1="178" x2="270" y2="124" stroke="#c62828" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="36" y="118" font-size="11.5" fill="#c62828" font-family="sans-serif">μ−2σ</text>
  <text x="216" y="118" font-size="11.5" fill="#c62828" font-family="sans-serif">μ+2σ</text>
  <text x="152" y="24" font-size="12" fill="#1565c0" font-family="sans-serif">μ</text>
  <text x="60" y="200" font-size="11.5" fill="#666" font-family="sans-serif">P(μ−σ&lt;X&lt;μ+σ)≈68.3%</text>
  <text x="190" y="200" font-size="11.5" fill="#666" font-family="sans-serif">P(μ−2σ&lt;X&lt;μ+2σ)≈95.4%</text>
</svg>
