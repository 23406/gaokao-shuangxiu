<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 210" width="280" height="210">
  <defs>
    <marker id="ah-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#222"/>
    </marker>
    <marker id="ah-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
    <marker id="ah-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#c62828"/>
    </marker>
  </defs>
  <!-- 斜面（楔形衬底淡色） -->
  <polygon points="40,180 240,80 240,180" fill="#eef7f0" stroke="none"/>
  <line x1="15" y1="180" x2="265" y2="180" stroke="#444" stroke-width="2"/>
  <line x1="40" y1="180" x2="240" y2="80" stroke="#444" stroke-width="2.5"/>
  <!-- 倾角 θ -->
  <path d="M40,180 L88,180 A60,60 0 0 0 61,150" fill="none" stroke="#888" stroke-width="1.2"/>
  <text x="52" y="170" font-size="13" fill="#555" font-family="sans-serif">θ</text>
  <!-- 物体 -->
  <g transform="translate(142,129) rotate(-26.57)">
    <rect x="-18" y="-20" width="36" height="20" fill="#f5f5f5" stroke="#222" stroke-width="1.8"/>
  </g>
  <!-- 受力：G 竖直向下 -->
  <line x1="138" y1="121" x2="138" y2="160" stroke="#222" stroke-width="2" marker-end="url(#ah-black)"/>
  <text x="145" y="156" font-size="14" fill="#222" font-family="sans-serif">G</text>
  <!-- N 垂直斜面向上 -->
  <line x1="138" y1="121" x2="122" y2="94" stroke="#1565c0" stroke-width="2" marker-end="url(#ah-blue)"/>
  <text x="110" y="94" font-size="14" fill="#1565c0" font-family="sans-serif">N</text>
  <!-- f 沿斜面向上 -->
  <line x1="138" y1="121" x2="168" y2="106" stroke="#c62828" stroke-width="2" marker-end="url(#ah-red)"/>
  <text x="162" y="98" font-size="14" fill="#c62828" font-family="sans-serif">f</text>
  <text x="20" y="20" font-size="11.5" fill="#666" font-family="sans-serif">斜面上物体受力：G 竖直向下 · N 垂直斜面 · f 沿斜面</text>
</svg>
