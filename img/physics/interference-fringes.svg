<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 210" width="380" height="210">
  <!-- 双缝干涉：Δx = Lλ/d -->
  <text x="190" y="16" font-size="12.5" fill="#444" font-family="sans-serif" text-anchor="middle">双缝干涉：相邻亮纹间距 Δx = L·λ/d</text>
  <!-- 光源 -->
  <rect x="14" y="96" width="18" height="34" fill="#ffd54f" stroke="#c62828" stroke-width="1.4"/>
  <text x="23" y="105" font-size="9.5" fill="#334" font-family="sans-serif" text-anchor="middle">光</text>
  <!-- 双缝板（三段留出两条缝） -->
  <rect x="92" y="30" width="6" height="62" fill="#546e7a"/>
  <rect x="92" y="105" width="6" height="13" fill="#546e7a"/>
  <rect x="92" y="131" width="6" height="53" fill="#546e7a"/>
  <!-- 缝 S1、S2 -->
  <line x1="95" y1="92" x2="95" y2="106" stroke="#111" stroke-width="2.5"/>
  <line x1="95" y1="118" x2="95" y2="132" stroke="#111" stroke-width="2.5"/>
  <!-- 光屏 -->
  <rect x="298" y="30" width="4" height="154" fill="#455a64"/>
  <!-- 屏上条纹：中央亮 + 两侧亮（暗=不画） -->
  <rect x="304" y="30" width="22" height="14" fill="#ffd54f" opacity="0.55"/>
  <rect x="304" y="46" width="22" height="14" fill="#ffd54f" opacity="0.95"/>
  <rect x="304" y="62" width="22" height="14" fill="#ffd54f" opacity="0.55"/>
  <rect x="304" y="78" width="22" height="14" fill="#ffd54f" opacity="0.95"/>
  <rect x="304" y="94" width="22" height="14" fill="#ffd54f" opacity="0.55"/>
  <rect x="304" y="110" width="22" height="14" fill="#ffd54f" opacity="0.95"/>
  <rect x="304" y="126" width="22" height="14" fill="#ffd54f" opacity="0.55"/>
  <rect x="304" y="142" width="22" height="14" fill="#ffd54f" opacity="0.95"/>
  <rect x="304" y="158" width="22" height="14" fill="#ffd54f" opacity="0.55"/>
  <rect x="304" y="172" width="22" height="14" fill="#ffd54f" opacity="0.95"/>
  <!-- 光线：两缝 → 中央亮纹 -->
  <line x1="95" y1="99" x2="298" y2="117" stroke="#ffb300" stroke-width="1.3" opacity="0.75"/>
  <line x1="95" y1="125" x2="298" y2="117" stroke="#ffb300" stroke-width="1.3" opacity="0.75"/>
  <line x1="95" y1="99" x2="298" y2="85" stroke="#ffb300" stroke-width="1" opacity="0.35"/>
  <line x1="95" y1="125" x2="298" y2="85" stroke="#ffb300" stroke-width="1" opacity="0.35"/>
  <!-- L 标注（缝板 → 屏） -->
  <line x1="98" y1="28" x2="298" y2="28" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="198" y="42" font-size="11.5" fill="#555" font-family="sans-serif" text-anchor="middle">L（双缝到屏）</text>
  <!-- d 标注（两缝间距） -->
  <line x1="84" y1="99" x2="84" y2="125" stroke="#8a8a8a" stroke-width="1.2"/>
  <line x1="80" y1="99" x2="88" y2="99" stroke="#8a8a8a" stroke-width="1"/>
  <line x1="80" y1="125" x2="88" y2="125" stroke="#8a8a8a" stroke-width="1"/>
  <text x="73" y="116" font-size="11.5" fill="#555" font-family="sans-serif" text-anchor="end">d</text>
  <!-- Δx 标注（相邻亮纹间距） -->
  <line x1="332" y1="101" x2="332" y2="117" stroke="#c62828" stroke-width="1.2"/>
  <line x1="329" y1="101" x2="335" y2="101" stroke="#c62828" stroke-width="1"/>
  <line x1="329" y1="117" x2="335" y2="117" stroke="#c62828" stroke-width="1"/>
  <text x="340" y="113" font-size="11.5" fill="#c62828" font-family="sans-serif">Δx</text>
  <!-- 底部说明 -->
  <text x="190" y="204" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">λ 越大 / d 越小，条纹越疏；白光：中央白纹，两侧紫蓝内、红橙外</text>
</svg>
