<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 300" width="540" height="300">
  <!-- 氢原子能级图：E_n = −13.6/n² eV，含主要跃迁与能量差 -->
  <defs>
    <marker id="hv-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#c62828"/>
    </marker>
    <marker id="hv-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#2e7d32"/>
    </marker>
    <marker id="hv-c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
  </defs>
  <text x="270" y="16" font-size="12.5" fill="#444" font-family="sans-serif" text-anchor="middle">氢原子能级：E_n = −13.6/n² eV（n=1 为基态）</text>
  <!-- E 轴（0 在上，负值向下） -->
  <line x1="96" y1="50" x2="96" y2="272" stroke="#444" stroke-width="1.4"/>
  <text x="84" y="302" font-size="11" fill="#444" font-family="sans-serif" text-anchor="end">E(eV)</text>
  <line x1="90" y1="50" x2="440" y2="50" stroke="#888" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="444" y="54" font-size="11" fill="#888" font-family="sans-serif">0（电离）</text>
  <!-- 能级线 n=4..1（比例：约 16.1px/eV） -->
  <line x1="120" y1="64" x2="440" y2="64" stroke="#1565c0" stroke-width="2"/>
  <line x1="120" y1="74" x2="440" y2="74" stroke="#1565c0" stroke-width="2"/>
  <line x1="120" y1="105" x2="440" y2="105" stroke="#1565c0" stroke-width="2"/>
  <line x1="120" y1="270" x2="440" y2="270" stroke="#1565c0" stroke-width="2.4"/>
  <text x="112" y="68" font-size="11.5" fill="#1565c0" font-family="sans-serif" text-anchor="end">n=4</text>
  <text x="112" y="78" font-size="11.5" fill="#1565c0" font-family="sans-serif" text-anchor="end">n=3</text>
  <text x="112" y="109" font-size="11.5" fill="#1565c0" font-family="sans-serif" text-anchor="end">n=2</text>
  <text x="112" y="274" font-size="11.5" fill="#1565c0" font-family="sans-serif" text-anchor="end">n=1</text>
  <text x="446" y="68" font-size="11" fill="#666" font-family="sans-serif">−0.85 eV</text>
  <text x="446" y="78" font-size="11" fill="#666" font-family="sans-serif">−1.51 eV</text>
  <text x="446" y="109" font-size="11" fill="#666" font-family="sans-serif">−3.40 eV</text>
  <text x="446" y="274" font-size="11" fill="#666" font-family="sans-serif">−13.6 eV</text>
  <!-- 跃迁箭头：向下发射光子 -->
  <line x1="250" y1="74" x2="250" y2="105" stroke="#c62828" stroke-width="2.2" marker-end="url(#hv-a)"/>
  <text x="256" y="94" font-size="11" fill="#c62828" font-family="sans-serif">3→2 发光 1.89 eV（Hα）</text>
  <line x1="350" y1="105" x2="350" y2="270" stroke="#c62828" stroke-width="2.2" marker-end="url(#hv-a)"/>
  <text x="126" y="192" font-size="11" fill="#c62828" font-family="sans-serif">2→1 发光 10.2 eV（紫外）</text>
  <line x1="400" y1="74" x2="400" y2="270" stroke="#2e7d32" stroke-width="1.8" marker-end="url(#hv-b)" stroke-dasharray="6,3"/>
  <text x="404" y="180" font-size="11" fill="#2e7d32" font-family="sans-serif">3→1 12.09 eV（虚线）</text>
  <text x="270" y="284" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">一群氢原子从 n=3 能级最多发出 C(3,2)=3 种光子；一个氢原子最多 n−1=2 种</text>
  <text x="270" y="296" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">电离时可吸收 ≥ |E_n| 的连续性能量（非分立光子）</text>
</svg>
