<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" font-family="sans-serif">
  <defs>
    <marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="40" y="28" font-size="16" fill="#444" font-weight="bold">质谱仪：加速 → 速度选择 → 磁场偏转 → 感光（同位素分离）</text>

  <!-- 离子源 -->
  <rect x="40" y="140" width="70" height="50" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="75" y="170" font-size="13" fill="#1565c0" text-anchor="middle">离子源</text>

  <!-- 加速区（两板） -->
  <rect x="112" y="118" width="8" height="94" fill="#666"/>
  <rect x="147" y="118" width="8" height="94" fill="#666"/>
  <text x="133" y="108" font-size="14" fill="#c62828" text-anchor="middle">U</text>
  <line x1="110" y1="165" x2="172" y2="165" stroke="#1565c0" stroke-width="2" marker-end="url(#arrb)"/>

  <!-- 速度选择器 -->
  <rect x="185" y="108" width="150" height="12" fill="#666"/>
  <rect x="185" y="222" width="150" height="12" fill="#666"/>
  <!-- E 场（向下） -->
  <line x1="250" y1="132" x2="250" y2="216" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrb)"/>
  <text x="261" y="172" font-size="14" fill="#2e7d32">E</text>
  <!-- B 场（垂直纸面向里：⊗） -->
  <g stroke="#555" stroke-width="1.4" fill="none">
    <circle cx="225" cy="180" r="9"/><line x1="219" y1="174" x2="231" y2="186"/><line x1="231" y1="174" x2="219" y2="186"/>
    <circle cx="297" cy="180" r="9"/><line x1="291" y1="174" x2="303" y2="186"/><line x1="303" y1="174" x2="291" y2="186"/>
  </g>
  <text x="285" y="160" font-size="12" fill="#555">B⊗</text>
  <!-- 通道内 v 箭头 -->
  <line x1="195" y1="200" x2="328" y2="200" stroke="#1565c0" stroke-width="2" marker-end="url(#arrb)"/>
  <text x="280" y="213" font-size="12" fill="#1565c0">v = E/B 直穿</text>

  <!-- 磁场区（偏转）：✕ 纸面向里 -->
  <g stroke="#999" stroke-width="1.3">
    <line x1="363" y1="110" x2="373" y2="120"/><line x1="373" y1="110" x2="363" y2="120"/>
    <line x1="405" y1="110" x2="415" y2="120"/><line x1="415" y1="110" x2="405" y2="120"/>
    <line x1="447" y1="110" x2="457" y2="120"/><line x1="457" y1="110" x2="447" y2="120"/>
    <line x1="363" y1="152" x2="373" y2="162"/><line x1="373" y1="152" x2="363" y2="162"/>
    <line x1="405" y1="152" x2="415" y2="162"/><line x1="415" y1="152" x2="405" y2="162"/>
    <line x1="447" y1="152" x2="457" y2="162"/><line x1="457" y1="152" x2="447" y2="162"/>
  </g>
  <!-- 轨迹（两同位素半径不同） -->
  <path d="M345,165 A110,110 0 0 1 455,275" fill="none" stroke="#1565c0" stroke-width="2.5"/>
  <path d="M345,165 A125,125 0 0 1 470,290" fill="none" stroke="#c62828" stroke-width="2.5"/>
  <circle cx="455" cy="275" r="4.5" fill="#1565c0"/>
  <circle cx="470" cy="290" r="4.5" fill="#c62828"/>
  <text x="392" y="222" font-size="12" fill="#1565c0">r₁（m₁ 小）</text>
  <text x="478" y="252" font-size="13" fill="#c62828" font-weight="bold">r₂</text>

  <!-- 信息框 -->
  <rect x="530" y="90" width="172" height="150" fill="none" stroke="#ccc" stroke-width="1.5"/>
  <text x="544" y="112" font-size="13" fill="#555" font-weight="bold">三个关键公式</text>
  <text x="544" y="138" font-size="12.5" fill="#444">qU = ½mv²（加速）</text>
  <text x="544" y="162" font-size="12.5" fill="#444">r = mv/(qB)（偏转）</text>
  <text x="544" y="186" font-size="12.5" fill="#444">r = (1/B)√(2mU/q)</text>
  <text x="544" y="210" font-size="12" fill="#c62828">r ∝ √m：质量大 → 半径大</text>
  <text x="544" y="228" font-size="12" fill="#c62828">→ 落点分离（同位素）</text>

  <!-- 底部注释 -->
  <line x1="40" y1="310" x2="680" y2="310" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="306" font-size="13" fill="#666">速度选择器洗出同速粒子（v = E/B 与 q、m 无关）→ 磁场中圆周运动 r ∝ √(m/q) → 感光片定位</text>
</svg>
