<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 235" width="320" height="235">
  <!-- 圆锥摆：水平面圆周运动，cosθ = g/(ω²L) -->
  <text x="160" y="16" font-size="12.5" fill="#444" font-family="sans-serif" text-anchor="middle">圆锥摆：摆球在水平面内做匀速圆周运动（θ 与 m 无关）</text>
  <!-- 悬点与竖直虚线 -->
  <circle cx="160" cy="28" r="3.5" fill="#333"/>
  <line x1="160" y1="28" x2="160" y2="210" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="4,3"/>
  <!-- 水平圆轨道（俯视投影椭圆） -->
  <ellipse cx="160" cy="88" rx="103.9" ry="26" fill="none" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.6"/>
  <!-- 细绳 -->
  <line x1="160" y1="28" x2="263.9" y2="88" stroke="#e65100" stroke-width="2"/>
  <!-- 摆球 -->
  <circle cx="263.9" cy="88" r="9" fill="#1e88e5" stroke="#0d47a1" stroke-width="1.5"/>
  <!-- 受力：T 沿绳（指向悬点）、mg 竖直向下、F_n 水平指向转轴 -->
  <defs>
    <marker id="cp-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#c62828"/>
    </marker>
    <marker id="cp-b" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#1565c0"/>
    </marker>
    <marker id="cp-c" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#e65100"/>
    </marker>
  </defs>
  <line x1="263.9" y1="88" x2="263.9" y2="134" stroke="#c62828" stroke-width="2" marker-end="url(#cp-a)"/>
  <text x="271" y="128" font-size="13" fill="#c62828" font-family="sans-serif">mg</text>
  <line x1="263.9" y1="88" x2="194" y2="88" stroke="#1565c0" stroke-width="2" marker-end="url(#cp-b)"/>
  <text x="212" y="80" font-size="12.5" fill="#1565c0" font-family="sans-serif">F_n = mg·tanθ</text>
  <line x1="263.9" y1="88" x2="237.9" y2="73" stroke="#e65100" stroke-width="1.6" marker-end="url(#cp-c)"/>
  <text x="248" y="66" font-size="13" fill="#e65100" font-family="sans-serif">T</text>
  <!-- θ 角弧 -->
  <path d="M160,58 A30,30 0 0 1 186,43" fill="none" stroke="#8a8a8a" stroke-width="1.2"/>
  <text x="176" y="50" font-size="12.5" fill="#555" font-family="sans-serif">θ</text>
  <!-- 半径 r = L sinθ 标注 -->
  <line x1="160" y1="104" x2="263.9" y2="104" stroke="#8a8a8a" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="212" y="122" font-size="12" fill="#666" font-family="sans-serif">r = L·sinθ</text>
  <!-- 底部说明 -->
  <text x="160" y="228" font-size="11" fill="#666" font-family="sans-serif" text-anchor="middle">竖直 T·cosθ = mg；水平 T·sinθ = mω²r ⇒ cosθ = g/(ω²L)</text>
</svg>
