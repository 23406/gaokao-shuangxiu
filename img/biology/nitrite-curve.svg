<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 300" width="560" height="300" font-family="sans-serif">
  <defs>
    <marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#444"/>
    </marker>
  </defs>

  <!-- 标题 -->
  <text x="40" y="26" font-size="16" fill="#444" font-weight="bold">泡菜腌制中：亚硝酸盐含量先升后降</text>

  <!-- 坐标轴 -->
  <line x1="70" y1="30" x2="70" y2="250" stroke="#444" stroke-width="2" marker-end="url(#arra)"/>
  <line x1="70" y1="250" x2="530" y2="250" stroke="#444" stroke-width="2" marker-end="url(#arra)"/>
  <text x="452" y="274" font-size="13" fill="#555">腌制时间</text>
  <text x="34" y="145" font-size="13" fill="#555" transform="rotate(-90 34 145)">亚硝酸盐含量</text>

  <!-- 曲线：先升后降（15 点折线采样） -->
  <polyline points="90,240 120,215 150,190 180,165 210,140 240,120 270,108 300,104 330,108 360,116 390,127 420,140 450,155 480,172 510,190"
    fill="none" stroke="#1565c0" stroke-width="3"/>

  <!-- 峰值标记 -->
  <line x1="300" y1="104" x2="300" y2="250" stroke="#999" stroke-width="1.3" stroke-dasharray="5 4"/>
  <circle cx="300" cy="104" r="5" fill="#c62828"/>
  <text x="310" y="98" font-size="12.5" fill="#c62828">峰值（腌制初期）</text>

  <!-- 阶段标注 -->
  <text x="120" y="180" font-size="13" fill="#c62828">迅速上升</text>
  <text x="380" y="150" font-size="13" fill="#2e7d32">缓慢下降</text>
  <text x="418" y="86" font-size="15" fill="#1565c0" font-weight="bold">先升后降</text>

  <!-- 底部说明 -->
  <line x1="70" y1="286" x2="520" y2="286" stroke="#ccc" stroke-width="1"/>
  <text x="70" y="282" font-size="12.5" fill="#666">下降原因：乳酸积累、pH 降低 → 抑制杂菌；腌制时间足够才安全</text>
</svg>
