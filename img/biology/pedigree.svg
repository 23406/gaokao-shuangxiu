<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <!-- 系谱图图例 -->
  <text x="18" y="18" font-size="11" fill="#666" font-family="sans-serif">□=男性 ○=女性 ◆=患病（填充为患者）</text>
  <!-- 第Ⅰ代：Ⅰ1 □ × Ⅰ2 ○（均正常） -->
  <rect x="52" y="40" width="22" height="22" fill="#f5f5f5" stroke="#222" stroke-width="1.6"/>
  <circle cx="112" cy="51" r="11" fill="#f5f5f5" stroke="#222" stroke-width="1.6"/>
  <line x1="74" y1="51" x2="101" y2="51" stroke="#222" stroke-width="1.2"/>
  <text x="49" y="76" font-size="11" fill="#444" font-family="sans-serif">Ⅰ1</text>
  <text x="108" y="76" font-size="11" fill="#444" font-family="sans-serif">Ⅰ2</text>
  <!-- 子女线 -->
  <line x1="87" y1="51" x2="87" y2="92" stroke="#222" stroke-width="1.2"/>
  <!-- 第Ⅱ代：Ⅱ1 ■（患病男性） × Ⅱ2 ○（正常女性） -->
  <rect x="64" y="100" width="22" height="22" fill="#222" stroke="#222" stroke-width="1.6"/>
  <circle cx="124" cy="111" r="11" fill="#f5f5f5" stroke="#222" stroke-width="1.6"/>
  <line x1="86" y1="111" x2="113" y2="111" stroke="#222" stroke-width="1.2"/>
  <text x="61" y="136" font-size="11" fill="#444" font-family="sans-serif">Ⅱ1</text>
  <text x="120" y="136" font-size="11" fill="#444" font-family="sans-serif">Ⅱ2</text>
  <line x1="99" y1="111" x2="99" y2="150" stroke="#222" stroke-width="1.2"/>
  <!-- 第Ⅲ代：Ⅲ1 ○（正常女性） -->
  <circle cx="99" cy="161" r="11" fill="#f5f5f5" stroke="#222" stroke-width="1.6"/>
  <text x="109" y="188" font-size="11" fill="#444" font-family="sans-serif">Ⅲ1</text>
  <text x="20" y="196" font-size="11" fill="#666" font-family="sans-serif">系谱图：Ⅰ1、Ⅰ2 正常 → Ⅱ1 患病（无中生有）</text>
</svg>
