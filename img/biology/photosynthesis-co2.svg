<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <marker id="ah" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <line x1="40" y1="165" x2="300" y2="165" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <line x1="40" y1="165" x2="40" y2="20" stroke="#444" stroke-width="1.5" marker-end="url(#ah)"/>
  <text x="280" y="182" font-size="11" fill="#444" font-family="sans-serif">时间 t</text>
  <text x="14" y="26" font-size="11" fill="#444" font-family="sans-serif">CO₂ 浓度</text>
  <!-- CO₂ 曲线：先下降到最低点，之后回升 -->
  <path d="M40,32 C 110,40 160,72 195,108 C 215,128 228,136 244,122 C 262,106 280,80 300,52"
        fill="none" stroke="#1565c0" stroke-width="2.2"/>
  <circle cx="212" cy="118" r="4.5" fill="#c62828" stroke="none"/>
  <line x1="212" y1="118" x2="212" y2="165" stroke="#c62828" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="96" y="66" font-size="11.5" fill="#2e7d32" font-family="sans-serif">光合&gt;呼吸（浓度下降）</text>
  <text x="214" y="42" font-size="11.5" fill="#b26a00" font-family="sans-serif">回升：光合&lt;呼吸</text>
  <!-- 最低点标注 -->
  <text x="218" y="112" font-size="11.5" fill="#c62828" font-family="sans-serif">最低点</text>
  <text x="222" y="128" font-size="11" fill="#c62828" font-family="sans-serif">净光合=0</text>
  <text x="44" y="196" font-size="11" fill="#666" font-family="sans-serif">密闭容器：CO₂ 达到最低点 ⇒ 光合=呼吸（光补偿点）</text>
</svg>
