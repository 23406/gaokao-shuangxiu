<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" width="620" height="430">
  <!-- 三角形四心：锐角△ABC 上 G/H/O/I 四心（同一三角形，全部在形内） -->
  <defs>
    <marker id="tc-a" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#444"/>
    </marker>
  </defs>
  <text x="310" y="18" font-size="11.5" fill="#444" font-family="sans-serif" text-anchor="middle">锐角△ABC 的四心：中线→G（蓝）　高线→H（红）　中垂线→O（绿）　角平分线→I（橙）</text>
  <!-- 辅助线（淡虚线） -->
  <line x1="120" y1="60" x2="360" y2="280" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.55"/>
  <line x1="120" y1="60" x2="256" y2="332" stroke="#c62828" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.55"/>
  <line x1="120" y1="60" x2="335" y2="292" stroke="#e65100" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.55"/>
  <line x1="355" y1="30" x2="290" y2="215" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.55"/>
  <!-- 三角形 -->
  <polygon points="120,60 520,200 200,360" fill="none" stroke="#333" stroke-width="2.2"/>
  <!-- 四心 -->
  <circle cx="280" cy="206.7" r="5.5" fill="#1565c0"/>
  <circle cx="228.8" cy="277.6" r="5.5" fill="#c62828"/>
  <circle cx="305.6" cy="171.2" r="5.5" fill="#2e7d32"/>
  <circle cx="264.8" cy="216.2" r="5.5" fill="#e65100"/>
  <!-- 标签（位置经截图验收） -->
  <text x="95" y="54" font-size="14" fill="#333" font-family="sans-serif">A</text>
  <text x="530" y="188" font-size="14" fill="#333" font-family="sans-serif">B</text>
  <text x="182" y="384" font-size="14" fill="#333" font-family="sans-serif">C</text>
  <text x="294" y="207" font-size="12" fill="#1565c0" font-family="sans-serif">G 重心</text>
  <text x="220" y="250" font-size="12" fill="#e65100" font-family="sans-serif">I 内心</text>
  <text x="180" y="300" font-size="12" fill="#c62828" font-family="sans-serif">H 垂心</text>
  <text x="318" y="168" font-size="12" fill="#2e7d32" font-family="sans-serif">O 外心</text>
  <!-- 说明 -->
  <text x="310" y="330" font-size="11.5" fill="#666" font-family="sans-serif" text-anchor="middle">辅助线：蓝=中线（AG=2·GD）　红=A 边高线　绿=AB 中垂线　橙=∠A 角平分线</text>
  <text x="310" y="355" font-size="11.5" fill="#666" font-family="sans-serif" text-anchor="middle">锐角时四心均在形内；钝角时 H、O 跑到形外</text>
  <text x="310" y="415" font-size="11.5" fill="#666" font-family="sans-serif" text-anchor="middle">欧拉线：O、G、H 三点共线，且 OG : GH = 1 : 2（此图 G 正是 O、H 之间 1/3 处）</text>
</svg>
